[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "Kyber"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "Kyber"
path = "src/main.rs"

# Hôte de native messaging pour l'extension navigateur (beta) : réutilise
# app_lib (même crypto/vault/license que l'app), parle JSON sur stdin/stdout.
[[bin]]
name = "kyber-native-host"
path = "src/bin/native_host.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Crypto classiques
aes-gcm = "0.10.3"
argon2 = "0.5.2"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8.5"
x25519-dalek = { version = "2.0.0", features = ["static_secrets"] }
ed25519-dalek = "2.0.0"

# Crypto Post-Quantique
pqcrypto-kyber = "0.8.0"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.4"

# Utilitaires
zeroize = { version = "1.6.0", features = ["zeroize_derive"] }
bincode = "1.3.3"
hkdf = "0.12"
sha2 = "0.10"
bip39 = "2.0.0"
enigo = "0.2"
arboard = "3"
csv = "1"
hex = "0.4"
dirs = "5.0"
base64 = "0.22.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

# Windows OS APIs (UIAutomation / Scanner)
[target.'cfg(windows)'.dependencies.windows]
version = "0.52.0"
features = [
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
]

# macOS Accessibility APIs (AXUIElement / Scanner)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication"] }

# Linux AT-SPI D-Bus (Scanner)
[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.19"
futures-util = "0.3"

# Binaire de distribution : plus rapide + plus léger (n'affecte que `cargo tauri build`)
[profile.release]
opt-level = 3          # code le plus rapide (crypto, IPC)
lto = true             # link-time optimization inter-crates
codegen-units = 1      # meilleure optimisation au prix d'un build plus long
panic = "abort"        # pas de tables de déroulement -> binaire plus petit
strip = true           # retire les symboles de debug
